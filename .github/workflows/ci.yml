name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bazel-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda_version:
          - 12_8_1
          - 12_9_1
          - 13_0_2
          - 13_1_1
          - 13_2_1
          - 13_3_1
          - 13_4_1
          - 13_5_0
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          module-root: e2e
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Bazel build //:all (${{ matrix.cuda_version }})
        working-directory: e2e
        run: bazel build //:all --platforms //:platform_linux_amd64_cuda_${{ matrix.cuda_version }}
      - name: Test shared library runtime staging (${{ matrix.cuda_version }})
        working-directory: e2e
        run: bazel test //:shared_runtime_smoke_test --platforms //:platform_linux_amd64_cuda_${{ matrix.cuda_version }}
      - name: Check CUDA tools across exec transition (${{ matrix.cuda_version }})
        working-directory: e2e
        run: bazel build //tests:toolchain_selection_check --platforms //:platform_linux_amd64_cuda_${{ matrix.cuda_version }} --extra_execution_platforms //tests:platform_linux_amd64_exec
      - name: Bazel analyze static smoke targets (${{ matrix.cuda_version }})
        working-directory: e2e
        run: bazel build //:cudnn_static_smoke //:cufile_static_smoke --nobuild --platforms //:platform_linux_amd64_cuda_${{ matrix.cuda_version }}

  windows-runtime:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: windows-2025, cpu: x86_64 }
          - { runner: windows-11-arm, cpu: arm64 }
        cuda_version: ["13_4_1", "13_5_0"]
    env:
      MSYS2_ARG_CONV_EXCL: '*'
    defaults:
      run:
        working-directory: e2e
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Test CUDA runtime on native Windows
        run: |
          flags=(
            --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0
            --extra_toolchains=@local_config_cc_toolchains//:all
            --platforms=//tests/windows_runtime:${{ matrix.platform.cpu }}_cuda_${{ matrix.cuda_version }}
          )
          bazelisk --output_user_root=C:/b test "${flags[@]}" --test_output=errors \
            //tests/windows_runtime:shared //tests/windows_runtime:static
          bazelisk --output_user_root=C:/b build "${flags[@]}" //tests/windows_runtime:system_link
